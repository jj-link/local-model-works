apiVersion: localmodelworks/v1alpha1
kind: Recipe
metadata:
  name: qwen38-flash-next-tensorfold-spark-tp1
  version: 3.0.0
  model: Qwen3.8-Flash-Next
  engine: tensorfold
  description: >-
    Runs the original pinned TensorFold preparation, start.sh and stop.sh on
    one 128 GB GB10 DGX Spark. Upstream builds TensorFold v1.1.4's native Zig
    engine with its 17 patches and serves nvidia/Qwen3.8-Flash-Next-FP4-Local
    (NVFP4 experts, MXFP8) with up to five concurrent streams sharing one
    cache pool, a 262,144-token context (also the maximum), lossy fp8 KV,
    vision and MTP drafts by default. The FP8 n-gram table loads with the
    weights. Optional settings retain the original defaults until explicitly
    selected. Requires Docker with the NVIDIA runtime, curl, Python 3, flock
    and roughly 107 GiB available memory; the engine keeps 9 GiB free, so run
    nothing else large on the Spark. Preparation downloads roughly 96 GiB of
    weights and pulls the matching image by digest or builds it; its disk
    checks require up to 114 GB for the model plus 40 GB for the image when
    co-located. Shared Hugging Face and kernel caches persist outside the
    checkout. This binding fixes the listener to 0.0.0.0:8000 instead of
    upstream's 8888, the model alias to Qwen3.8-Flash-Next and the observed
    container to qwen38-flash-next-tf. Stop interrupts active requests and
    removes that container. Source pinning does not freeze fallback-build
    dependencies and does not roll back host, Docker or cache changes. Model
    weights use the NVIDIA Open Model Agreement over a Qwen Community License
    1.0 base, separately from the MIT recipe. The optional ABLIT overlay is
    gated and removes safety refusals. Port 8000 conflicts with other
    single-Spark servers.
  # Original scripts and TensorFold patches: MIT, Copyright 2026 MiaAI-Lab
  # and TensorFold contributors; retained fixture LICENSE includes both notices.
  license: MIT
  source:
    url: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark-TensorFold
    revision: "20e15e41f2f514a0d287710f4665ee1b5009ba41"
    path: .
compatibility:
  nodeCount: 1
  accelerator:
    vendor: nvidia
    architectures: [sm_121]
    count: 1
artifacts: []
parameters: []
workloads:
  - ranks: [0]
    upstream:
      install:
        - ["./scripts/prepare.sh"]
      start: ["./start.sh"]
      stop: ["./stop.sh"]
      containers: [qwen38-flash-next-tf]
      envFile: .env
      envFormat: literal
    env:
      PORT: "8000"
      HOST: "0.0.0.0"
      CONTAINER_NAME: qwen38-flash-next-tf
      SERVED_NAME: Qwen3.8-Flash-Next
    permissions: [host.upstream-exec]
    ports:
      - container: 8000
        host: 8000
        protocol: tcp
    readiness:
      httpGet:
        method: GET
        path: /health
        port: 8000
      timeoutSeconds: 5
