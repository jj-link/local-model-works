apiVersion: localmodelworks/v1alpha1
kind: Recipe
metadata:
  name: glm53-flash-exl3-dflash2-spark-tp2
  version: 2.2.1
  model: GLM-5.3-Flash-EXL3
  engine: vllm
  description: >-
    Runs the original pinned EXL3 start.sh and TP2-only stop.sh on the head
    of two GB10 Sparks. Upstream builds or acquires and ships its own image,
    downloads/synchronizes target and drafter, prepares overlays and launches
    its worker/head commands with host network/IPC and RDMA. LMW observes
    both authored container identities and independently verifies worker teardown.
    Requires Docker/NVIDIA/RDMA, curl, rsync/scp, flock, Python with Jinja2,
    supported Hugging Face tooling and noninteractive head-to-worker SSH.
    Allow at least the upstream 180 GiB per node plus image/build/JIT storage.
    The authored defaults include the InstantTensor image/loader pair,
    fair mixed-prefill scheduling and bounded multimodal processing.
    Start/restart uses lifecycle locking and checks memory on both nodes;
    restart can fail after stopping the old pair. Source pinning does not
    pin every upstream dependency or roll back host changes and shared caches.
  # Upstream code: Mia's AI Lab; retain LICENSE and pre-relicense LICENSE.MIT.
  # Target weights: ShapleyMCG License 1.0; drafter: CC-BY-NC-ND-4.0.
  license: AGPL-3.0-only
  source:
    url: https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks
    revision: "8f29c6dd42da945884d087f1b98ffd4850bb7bd8"
    path: .
compatibility:
  nodeCount: 2
  accelerator:
    vendor: nvidia
    architectures:
      - sm_121
    count: 1
  fabric:
    transport: roce
    minBandwidthGbps: 100
artifacts: []
parameters:
  - name: worker_ssh
    type: string
    minLength: 1
    description: Upstream WORKER_SSH; an existing SSH alias or user@host for the selected worker, reachable noninteractively from the head agent account.
  - name: worker_home
    type: string
    minLength: 1
    description: Actual absolute home directory of that account; upstream stores worker caches there.
workloads:
  - ranks: [0, 1]
    upstream:
      coordinatorRank: 0
      start: ["./start.sh"]
      stop: ["./stop.sh", "tp2"]
      containers: [glm53-exl3-head]
      containersByRank:
        "1": [glm53-exl3-worker]
      envFile: .env
      envTemplate: .env.example
      envFormat: shell
    env:
      HEAD_IP: "${cluster.node.0.fabric.node_addr}"
      WORKER_IP: "${cluster.node.1.fabric.node_addr}"
      WORKER_HOME: "${setting.worker_home}"
      WORKER_SSH: "${setting.worker_ssh}"
      HEAD_CX7_IF: "${cluster.node.0.fabric.interface}"
      WORKER_CX7_IF: "${cluster.node.1.fabric.interface}"
      HEAD_CX7_IB: "${cluster.node.0.fabric.rdma_device}"
      WORKER_CX7_IB: "${cluster.node.1.fabric.rdma_device}"
      HEAD_GID: "${cluster.node.0.fabric.gid_index}"
      WORKER_GID: "${cluster.node.1.fabric.gid_index}"
    permissions: [host.upstream-exec]
    ports:
      - container: 8888
        host: 8888
        protocol: tcp
    readiness:
      httpGet:
        method: GET
        path: /health
        port: 8888
      timeoutSeconds: 5
