apiVersion: localmodelworks/v1alpha1
kind: Recipe
metadata:
  name: MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark
  version: 2.2.0
  model: qwen3.8-27b-sglang
  engine: sglang
  description: >-
    Runs the original pinned MTP start.sh and stop.sh on one GB10 DGX Spark.
    Copies the authored .env.sample as literal KEY=value configuration;
    its actual concurrency default is 16, despite the older README text.
    Upstream owns image/model downloads, CPU pinning, privileged Docker,
    host network/IPC, port 8888 and persistent source-relative caches.
    Stop also addresses the legacy qwen3.8-27b-sglang-mtp container.
    No LMW swap, swappiness, cache-dropping or reconstructed serving command
    is applied. Source pinning does not pin mutable image/model dependencies.
    Requires Bash, Docker/NVIDIA GPU access and curl as the node agent account.
  license: MIT
  source:
    url: https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark
    revision: "9d21dcd331232792e7d39f4f84db7dd46635905d"
    path: .
compatibility:
  nodeCount: 1
  accelerator:
    vendor: nvidia
    architectures:
      - sm_121
    count: 1
    minMemoryBytes: 128849018880
artifacts: []
parameters:
  - name: quant
    type: enum
    default: nvfp4
    enum: [nvfp4, nvfp4-fp4, fp8, bf16]
    description: The original QUANT selector chooses the checkpoint inside start.sh.
  - name: max_concurrent_requests
    type: int
    default: 16
    min: 1
    description: Upstream MAX_CONCURRENT_REQUESTS; 16 is the pinned sample's actual value.
workloads:
  - upstream:
      start: ["./start.sh"]
      stop: ["./stop.sh"]
      containers: [qwen3.8-27b-sglang]
      auxiliaryContainers: [qwen3.8-27b-sglang-mtp]
      envFile: .env
      envTemplate: .env.sample
      envFormat: literal
      logFile: .sglang.log
    env:
      QUANT: "${setting.quant}"
      MAX_CONCURRENT_REQUESTS: "${setting.max_concurrent_requests}"
    permissions: [host.upstream-exec]
    ports:
      - container: 8888
        host: 8888
        protocol: tcp
    readiness:
      httpGet:
        method: GET
        path: /v1/models
        port: 8888
