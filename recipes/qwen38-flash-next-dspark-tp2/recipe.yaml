apiVersion: localmodelworks/v1alpha1
kind: Recipe
metadata:
  name: qwen38-flash-next-dspark-tp2
  version: 2.2.0
  model: qwen3.8-flash-next
  engine: vllm
  description: >-
    Runs the original pinned start.sh and stop.sh once on the head Spark.
    Upstream downloads and distributes the model, prepares its own image
    overlays, generates its original rank commands and starts the worker
    before the API head. LMW independently observes vllm-fn on both nodes.
    The copied .env.sample selects NVIDIA NVFP4 and native 262144 context.
    Requires two otherwise-idle GB10 Sparks, Docker/NVIDIA/RDMA access,
    Python3, a supported Hugging Face download CLI, rsync/scp, curl and
    noninteractive head-to-worker SSH over the selected fabric address.
    Upstream uses one shared GID index, host network/IPC and persistent
    caches. Its image tag and model download are not made immutable by the
    source pin; upstream cache reuse does not prove a model revision update.
    No generated LMW launcher or independently selected patch set is used.
  license: AGPL-3.0-or-later AND Apache-2.0
  source:
    url: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks
    revision: "c2325b22602b51a5faf55fc2bebccc34f3f80b9f"
    path: .
compatibility:
  nodeCount: 2
  accelerator:
    vendor: nvidia
    architectures:
      - sm_121
    count: 1
  fabric:
    transport: roce
    minBandwidthGbps: 100
    sharedGIDIndex: true
artifacts: []
parameters:
  - name: worker_user
    type: string
    minLength: 1
    description: Existing worker SSH account reachable over the fabric from the head agent account.
workloads:
  - ranks: [0, 1]
    upstream:
      coordinatorRank: 0
      start: ["./start.sh"]
      stop: ["./stop.sh"]
      containers: [vllm-fn]
      envFile: .env
      envTemplate: .env.sample
      envFormat: shell
    env:
      HEAD_IP: "${cluster.node.0.fabric.node_addr}"
      WORKER_IP: "${cluster.node.1.fabric.node_addr}"
      WORKER_USER: "${setting.worker_user}"
      IFACE: "${cluster.node.0.fabric.interface}"
      WORKER_IFACE: "${cluster.node.1.fabric.interface}"
      IB_HCA: "=${cluster.node.0.fabric.rdma_device}"
      WORKER_IB_HCA: "=${cluster.node.1.fabric.rdma_device}"
      IB_GID_INDEX: "${cluster.node.0.fabric.gid_index}"
    permissions: [host.upstream-exec]
    ports:
      - container: 8888
        host: 8888
        protocol: tcp
    readiness:
      httpGet:
        method: GET
        path: /health
        port: 8888
      timeoutSeconds: 5
