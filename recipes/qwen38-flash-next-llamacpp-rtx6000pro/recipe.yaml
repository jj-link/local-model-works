apiVersion: localmodelworks/v1alpha1
kind: Recipe
metadata:
  name: qwen38-flash-next-llamacpp-rtx6000pro
  version: 1.0.0
  model: Qwen3.8-Flash-Next
  engine: llama.cpp
  description: >-
    Full Qwen3.8-Flash-Next UD-Q4_K_XL with shared Q8_0 MTP and F16 vision
    projector on one LMW-selected SM120 GPU. Four original model shards,
    the shared MTP head and the projector are individually checksum-pinned;
    acquisition never requests the other quantizations in the Hugging Face
    repository. Unsloth b11539-mix-2500203 runs with GPU-resident main layers,
    lazy file-backed PLE, mmap, explicit context sizing and five MTP drafts.
    The default is 262144 context tokens and one concurrent request. CPU and
    RAM remain unlimited by the container; no host memory tuning is required.
    A verified portable runtime archive is extracted into /opt/llama-runtime
    in the writable container layer, then the launcher execs upstream
    llama-server. The source revision identifies the release automation;
    the portable binary reports mixed-build source commit
    1cdd47c403d51390d85872bf3e1e50c5ca3ccae9, not an independently retrievable
    source tree. Model weights use Qwen Community License 1.0; llama.cpp is MIT.
  license: MIT AND LicenseRef-Qwen-Community-1.0
  source:
    url: https://github.com/unslothai/llama.cpp
    revision: "3a1e7cc1d81709ba368a4ca41e138fadabceeb13"
    path: .
