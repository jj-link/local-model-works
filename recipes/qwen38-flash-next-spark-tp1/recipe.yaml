apiVersion: localmodelworks/v1alpha1
kind: Recipe
metadata:
  name: qwen38-flash-next-spark-tp1
  version: 2.4.0
  model: qwen3.8-flash-next
  engine: vllm
  description: >-
    Runs the original pinned download.sh, start.sh and stop.sh on one
    otherwise-idle GB10 DGX Spark. The authored .env.sample supplies the
    native-context MTP-3 profile. Upstream prepares its own image-derived
    overlays and packed PLE tables, applies its memory and host-service
    guards, launches Docker with host network/IPC and authored capabilities,
    and runs its original host watchdog. Source-relative generated files
    and home-directory model/PLE caches are preserved; allow about 130 GiB
    for model and packed PLE data, plus images and other caches. Requires
    Bash, Python3, Docker/NVIDIA GPU access, curl and the authored Linux
    utilities. No local serving launcher, memory cap or watchdog replaces
    upstream. Source pinning does not pin upstream image/model downloads.
    PORT follows the node's serve-port label (8000 when unlabelled).
  license: AGPL-3.0-or-later AND Apache-2.0
  source:
    url: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark
    revision: "b7c5da1a9e7448a14b480deee66eda3799b1eb43"
    path: .
compatibility:
  nodeCount: 1
  accelerator:
    vendor: nvidia
    architectures:
      - sm_121
    count: 1
    minMemoryBytes: 128849018880
artifacts: []
workloads:
  - upstream:
      install:
        - ["./download.sh"]
      start: ["./start.sh"]
      stop: ["./stop.sh"]
      containers: [vllm-fn-tp1]
      auxiliaryContainers: [vllm-fn-tp1-plebuild]
      envFile: .env
      envTemplate: .env.sample
      envFormat: shell
      logFile: logs/memwatch-vllm-fn-tp1.log
    env:
      PORT: "${node.port}"
    permissions: [host.upstream-exec]
    ports:
      - container: 8000
        host: 8000
        protocol: tcp
    readiness:
      httpGet:
        method: GET
        path: /health
        port: 8000
      timeoutSeconds: 5
