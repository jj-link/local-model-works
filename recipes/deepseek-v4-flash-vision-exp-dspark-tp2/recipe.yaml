apiVersion: localmodelworks/v1alpha1
kind: Recipe
metadata:
  name: deepseek-v4-flash-vision-exp-dspark-tp2
  version: 2.2.1
  model: deepseek-v4-flash-vision-exp
  engine: vllm
  description: >-
    Runs the original pinned DeepSeek DSpark procedure across two GB10
    Sparks. Both nodes pull the selected image (digest-pinned by default);
    the head runs original selected-model preparation and start/stop
    coordinators. The worker is independently observed, not given a
    reconstructed rank launcher. Upstream owns Compose, model preparation,
    overlays, host network/IPC, RDMA, persistent caches and restart behavior.
    Stop also cleans the authored legacy project/sidecar scope. Requires
    Docker/Compose with NVIDIA and RDMA access, curl, SSH/scp and working
    noninteractive head-to-worker authentication. Hosts must satisfy the
    original memory/service prerequisites, including disabled earlyoom.
    Worker deployment/cache paths must be explicitly chosen for its SSH
    account. Preserving source/version records does not undo shared cache,
    image, service or remote-file changes made by upstream.
    Reviewed runtime bindings include the original Compose dependency and
    preserve its engine command, computed defaults and hotfix ordering.
  license: MIT
  source:
    url: https://github.com/MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark
    revision: "957890ac5e26ce149646719298169f80603a3e1f"
    path: .
compatibility:
  nodeCount: 2
  accelerator:
    vendor: nvidia
    architectures:
      - sm_121
    count: 1
  fabric:
    transport: roce
    minBandwidthGbps: 100
artifacts: []
parameters:
  - name: worker_host
    type: string
    minLength: 1
    description: Upstream WORKER_HOST; an existing SSH alias or user@host for the selected worker, reachable noninteractively from the head agent account.
  - name: worker_directory
    type: string
    minLength: 1
    description: Upstream WORKER_SCRIPT_DIR; writable absolute deployment path on the worker.
  - name: worker_hf_cache
    type: string
    minLength: 1
    description: Upstream WORKER_HF_CACHE; writable absolute Hugging Face cache on the worker.
  - name: dspark_vllm_image
    type: string
    default: ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
    minLength: 1
    description: Original image used by both node pulls, model preparation and Compose serving. Alternate images must support this pinned upstream lifecycle.
workloads:
  - ranks: [0, 1]
    upstream:
      coordinatorRank: 0
      install:
        - ["docker", "pull", "${setting.dspark_vllm_image}"]
        - ["./prepare-dspark-model-cache.sh", "--yes"]
      installByRank:
        "1":
          - ["docker", "pull", "${setting.dspark_vllm_image}"]
      start: ["./start-deepseek-v4-flash-dspark.sh"]
      stop: ["./stop-deepseek-v4-flash-dspark.sh"]
      containers: [deepseek-v4-flash-vllm-dspark-1]
      envFile: .env.dspark
      envTemplate: .env.dspark.example
      envFormat: shell
    env:
      WORKER_HOST: "${setting.worker_host}"
      WORKER_SCRIPT_DIR: "${setting.worker_directory}"
      WORKER_HF_CACHE: "${setting.worker_hf_cache}"
      DSPARK_VLLM_IMAGE: "${setting.dspark_vllm_image}"
      MASTER_ADDR: "${cluster.node.0.fabric.node_addr}"
      VLLM_HOST_IP: "${cluster.node.0.fabric.node_addr}"
      WORKER_VLLM_HOST_IP: "${cluster.node.1.fabric.node_addr}"
      NCCL_IB_HCA: "=${cluster.node.0.fabric.rdma_device}"
      NCCL_SOCKET_IFNAME: "${cluster.node.0.fabric.interface}"
      TP_SOCKET_IFNAME: "${cluster.node.0.fabric.interface}"
      GLOO_SOCKET_IFNAME: "${cluster.node.0.fabric.interface}"
      WORKER_NCCL_IB_HCA: "=${cluster.node.1.fabric.rdma_device}"
      WORKER_NCCL_SOCKET_IFNAME: "${cluster.node.1.fabric.interface}"
      WORKER_TP_SOCKET_IFNAME: "${cluster.node.1.fabric.interface}"
      WORKER_GLOO_SOCKET_IFNAME: "${cluster.node.1.fabric.interface}"
    permissions: [host.upstream-exec]
    ports:
      - container: 8888
        host: 8888
        protocol: tcp
    readiness:
      httpGet:
        method: GET
        path: /health
        port: 8888
      timeoutSeconds: 5
