apiVersion: localmodelworks/v1alpha1
kind: Recipe
metadata:
  name: qwen38-27b-rtx6000pro-dflash2
  version: 1.0.0
  displayName: Qwen3.8-27B NVFP4 DFlash2 — RTX PRO 6000
  description: >-
    RadixArk Qwen3.8-27B NVFP4 on one SM120 RTX PRO 6000 with the pinned
    MiaAI-Lab SGLang DFlash2 backport, native 262K context, FP8 KV cache,
    eight concurrent requests, OpenAI API on port 8888, and logprob support.
  license: NOASSERTION
  source:
    url: https://github.com/MiaAI-Lab/Qwen3.8-27B-RTX-6000-PRO-SGLang-DSpark.git
    revision: "c172405482871566033d4d8f5ac519e7a3ce1f79"
    path: .
compatibility:
  nodeCount: 1
  accelerator:
    vendor: nvidia
    architectures:
      - sm_120
    count: 1
artifacts:
  - name: model
    kind: model
    source:
      type: huggingface
      identity: hf://RadixArk/Qwen3.8-27B-NVFP4
      revision: "91cea059647696fd83964e43d57db122ff745993"
    mount: /models/hub/models--RadixArk--Qwen3.8-27B-NVFP4
    validation: snapshot
  - name: drafter
    kind: model
    source:
      type: huggingface
      identity: hf://z-lab/Qwen3.8-27B-DFlash2
      revision: "50307d4c4cde6860d4eee73e2547cd786fe8e8a4"
    mount: /models/hub/models--z-lab--Qwen3.8-27B-DFlash2
    validation: snapshot
workloads:
  - match:
      nodeCount: 1
      accelerator:
        vendor: nvidia
        architectures:
          - sm_120
    image:
      reference: lmsysorg/sglang@sha256:febfb971c7352570fc445c466ebd6ffc9d896024958e544a60f2137fd85856b1
      digest: sha256:febfb971c7352570fc445c466ebd6ffc9d896024958e544a60f2137fd85856b1
    command:
      - /bin/bash
      - /lmw/assets/serve.sh
    args: []
    env:
      MODEL_PATH: "${artifact.model.path}"
      DRAFTER_PATH: "${artifact.drafter.path}"
      SERVED: qwen3.8-27b-6000pro
      PORT: "8888"
      MAX_RUNNING_REQUESTS: "8"
    devices:
      accelerator:
        all: true
    networkMode: host
    permissions:
      - network.host
      - memory.shm-large
    ports:
      - container: 8888
        host: 8888
        protocol: tcp
    resources:
      cpu: 16
      memoryBytes: 103079215104
      shmBytes: 34359738368
      tmpfsBytes: 8589934592
      pids: 8192
assets:
  - serve.sh
  - patch/sglang/srt/models/dflash.py
  - patch/sglang/kernels/ops/speculative/dflash.py
  - patch/sglang/srt/speculative/dflash_utils.py
  - patch/sglang/srt/speculative/dflash_worker_v2.py
  - patch/sglang/srt/speculative/dflash_info.py
  - patch/sglang/srt/speculative/dflash_info_v2.py
  - patch/sglang/srt/speculative/draft_worker_common.py
  - patch/sglang/srt/speculative/spec_utils.py
  - patch/sglang/srt/mem_cache/allocation_sizing.py
  - patch/sglang/srt/layers/moe/utils.py
  - patch/sglang/srt/layers/logprob_processor.py
  - patch/sglang/LICENSE
  - patch/sglang/README.md
