apiVersion: localmodelworks/v1alpha1
kind: Recipe
metadata:
  name: qwen38-27b-radixark-nvfp4-dflash2-avt
  version: 2.2.0
  model: qwen3.8-27b-6000pro
  engine: sglang
  description: >-
    Runs the original pinned MiaAI-Lab start.sh and stop.sh from a complete
    writable checkout on one RTX PRO 6000. Upstream owns its SGLang image,
    DFlash2 overlay, target/drafter downloads and persistent caches. The
    original privileged Docker command uses all GPUs, host network and host
    IPC, and inherits the image entrypoint. The reviewed GPU placement and
    port 8000 are bound into the original script. No local
    launcher, CPU multimodal workaround or admin-authentication substitution
    is applied. The source pin does not pin upstream image tags or model
    downloads. Requires Bash, Docker/NVIDIA GPU access and curl on the node;
    the agent account must have any required Hugging Face access.
  license: Apache-2.0
  source:
    url: https://github.com/MiaAI-Lab/Qwen3.8-27B-RTX-6000-PRO-SGLang-DSpark
    revision: "a0743929ee2b8946bbc62aa0835c7634ae823ffc"
    path: .
compatibility:
  nodeCount: 1
  accelerator:
    vendor: nvidia
    architectures:
      - sm_120
    count: 1
artifacts: []
parameters:
  - name: model_id
    type: string
    default: RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead
    minLength: 1
    description: Upstream MODEL_ID input; the served API model name remains fixed.
  - name: max_concurrent_requests
    type: int
    default: 8
    min: 1
    description: Upstream MAX_CONCURRENT_REQUESTS input.
workloads:
  - upstream:
      start: ["./start.sh"]
      stop: ["./stop.sh"]
      containers: [qwen3.8-27b-sglang-6000pro]
      logFile: .sglang.log
    env:
      MODEL_ID: "${setting.model_id}"
      MAX_CONCURRENT_REQUESTS: "${setting.max_concurrent_requests}"
    permissions: [host.upstream-exec]
    ports:
      - container: 8000
        host: 8000
        protocol: tcp
    readiness:
      httpGet:
        method: GET
        path: /v1/models
        port: 8000
