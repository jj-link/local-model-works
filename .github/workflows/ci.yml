name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: make generate
      - name: Generation is idempotent
        run: |
          make generate
          git diff --exit-code

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test -- --run
      - run: npm --prefix web run build

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
