# Opt-in only: installed by lmw-agent install --upstream-host-policy=host.
# Authored source runs with the service user's host/Docker/sudo authority.
# No privilege grants are created; provision required access separately.
# Workers intentionally survive service stop/restart; stop workloads first when
# retiring the agent. Disabling execution in agent.env does not revoke workers.
[Service]
NoNewPrivileges=false
PrivateTmp=false
ProtectSystem=false
ProtectHome=false
ProtectKernelTunables=false
ProtectKernelModules=false
ProtectControlGroups=false
RestrictSUIDSGID=false
LockPersonality=false
ReadWritePaths=
KillMode=process
