<script src="fixtures.js"></script>
<script src="shared.js"></script>
<script src="install-chooser.js?v=individual-hardware-2"></script>
<script src="lmw-shell.js?v=integrated-1"></script>
<script>
(function () {
  var app = document.getElementById("app");
  var state = LMW.parseState();
  var opts = { q: "", trusts: [], sources: [], node: 0, sort: "name" };
  var grid = document.querySelector("[data-grid]");
  var selected = null;

  function seal(r) { return '<span class="cat-seal cat-seal--' + r.source.type + '" aria-hidden="true">' + LMW.SOURCE_ICON[r.source.type] + "</span>"; }
  function compatSentence(r) {
    return r.compatibility.node_count + (r.compatibility.node_count === 1 ? " node" : " nodes") +
      (r.compatibility.rdma ? " · RDMA fabric" : "");
  }
  function updateNote() {
    return '<span class="cat-upd">Choose installation hardware →</span>';
  }
  function installStatus(r) {
    var count = LMWInstall.installedDeviceCount(r);
    if (count > 0) {
      return '<span class="cat-install-state is-installed">Installed on ' + count + (count === 1 ? " device" : " devices") + "</span>";
    }
    return '<span class="cat-install-state is-not-installed">Not installed</span>';
  }


  function card(r) {
    var d = document.createElement("article");
    d.className = "cat-card";
    d.dataset.id = r.id;
    d.setAttribute("tabindex", "0");
    d.setAttribute("role", "button");
    d.setAttribute("aria-label", "Choose installation hardware for " + r.name);
    if (selected && selected.id === r.id) d.classList.add("is-open");
    d.innerHTML =
      '<div class="cat-cardtop">' + seal(r) + installStatus(r) + "</div>" +
      '<h3 class="cat-cardname">' + r.name + "</h3>" +
      '<p class="cat-carddesc">' + r.description + "</p>" +
      '<div class="cat-compat">' + compatSentence(r) + "</div>" +
      '<div class="cat-updrow">' + updateNote(r) + "</div>" +
      '<footer class="cat-meta mono">' + r.version + " · " + LMW.shortDigest(r.digest) +
        " · " + r.license + "</footer>";
    d.addEventListener("click", function () { openDetail(r); });
    d.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(r); }
    });
    return d;
  }


  function render() {
    var list = LMW.filterSort(window.LMX_RECIPES, opts);
    LMW.applyState(app, state, list.length);
    grid.innerHTML = "";
    list.forEach(function (r) { grid.appendChild(card(r)); });
  }

  function openDetail(r) {
    selected = r;
    grid.querySelectorAll(".cat-card").forEach(function (c) { c.classList.toggle("is-open", c.dataset.id === r.id); });
    var body = document.querySelector("[data-detailbody]");
    body.innerHTML =
      '<div class="cat-detailtop">' + seal(r) + '</div>' +
      '<h2 class="cat-detailname">' + r.name + "</h2>" +
      '<p class="cat-detaildesc">' + r.description + "</p>" +
      LMWInstall.markup(r);
    var det = document.querySelector("[data-detail]");
    det.classList.add("is-install");
    document.querySelector(".cat-detailkicker").textContent = "Install recipe";
    det.hidden = false;
    det.setAttribute("aria-hidden", "false");
    LMWInstall.wire(body, r);
  }

  // close detail
  function closeDetail() {
    var det = document.querySelector("[data-detail]");
    det.hidden = true;
    det.setAttribute("aria-hidden", "true");
    det.classList.remove("is-install");
    var open = grid.querySelector(".cat-card.is-open");
    if (open) open.classList.remove("is-open");
  }
  document.querySelector("[data-close-detail]").addEventListener("click", closeDetail);
  window.addEventListener("lmw:close-detail", closeDetail);

  // Filters
  function setFilters() {
    var active = document.querySelector("[data-result-count]");
    if (active) active.textContent = String(LMW.filterSort(window.LMX_RECIPES, opts).length);
    render();
  }
  function toggleList(attr, key, val) {
    var arr = opts[key].slice();
    var i = arr.indexOf(val);
    if (i === -1) arr.push(val); else arr.splice(i, 1);
    opts[key] = arr;
    document.querySelectorAll("[data-" + attr + '="' + val + '"]').forEach(function (c) { c.classList.toggle("is-on", arr.indexOf(val) !== -1); });
    setFilters();
  }
  app.querySelectorAll("[data-chip-trust]").forEach(function (b) {
    b.addEventListener("click", function () { toggleList("chip-trust", "trusts", b.dataset.chipTrust); });
  });
  app.querySelectorAll("[data-chip-source]").forEach(function (b) {
    b.addEventListener("click", function () { toggleList("chip-source", "sources", b.dataset.chipSource); });
  });
  app.querySelectorAll("[data-chip-node]").forEach(function (b) {
    b.addEventListener("click", function () {
      var v = Number(b.dataset.chipNode) || 0;
      var anyOn = document.querySelectorAll('[data-chip-node].is-on').length > 1;
      document.querySelectorAll("[data-chip-node]").forEach(function (x) { x.classList.remove("is-on"); });
      if (!anyOn && v === opts.node) { opts.node = 0; b.classList.add("is-on"); b.classList.remove("is-on"); }
      else { opts.node = v; b.classList.add("is-on"); }
      setFilters();
    });
  });
  document.querySelector("[data-q]").addEventListener("input", function (e) { opts.q = e.target.value; setFilters(); });
  var sortSel = document.querySelector("[data-sort]");
  if (sortSel) sortSel.addEventListener("change", function (e) { opts.sort = e.target.value; render(); });
  var clearBtn = document.querySelector("[data-clear]");
  if (clearBtn) clearBtn.addEventListener("click", function () {
    opts = { q: "", trusts: [], sources: [], node: 0, sort: opts.sort };
    var q = document.querySelector("[data-q]");
    if (q) q.value = "";
    render();
  });


  LMW.bindEscape(app);
  render();
})();
</script>
