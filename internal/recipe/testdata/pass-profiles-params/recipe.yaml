apiVersion: localmodelworks/v1alpha1
kind: Recipe
metadata:
  name: lmw-demo-profiles
  version: 1.0.0
  description: Validation fixture pass-profiles-params.
  license: MIT
  source:
    url: https://fixtures.local/pass-profiles-params
    revision: "0000000000000000000000000000000000000000"
    path: .
compatibility:
  nodeCount: 1
artifacts: []
workloads:
  - image:
      reference: ghcr.io/localmodelworks/demo-serve:1.0.0
      digest: sha256:1f2e3d4c5b6a798091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708
    command:
      - serve
    args:
      - --profile
      - ${profile.fast}
    resources:
      cpu: 1
      memoryBytes: 16777216
      pids: 64
parameters:
  - name: gpu_util
    type: int
    default: 50
    min: 0
    max: 100
  - name: mode
    type: enum
    enum:
      - fast
      - safe
profiles:
  fast:
    gpu_util: 90
    mode: fast
  safe:
    gpu_util: 10
    mode: safe
