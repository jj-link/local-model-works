components:
  parameters:
    ExperimentID:
      in: path
      name: id
      required: true
      schema:
        type: string
    ExportID:
      in: path
      name: id
      required: true
      schema:
        type: string
    ID:
      in: path
      name: id
      required: true
      schema:
        type: string
    TraceID:
      in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource conflict (occupation, duplicate, stale state)
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource not found
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Required agent(s) unavailable
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Missing or invalid session
    Unprocessable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Incompatible plan or invalid input
  schemas:
    Accelerator:
      properties:
        architecture:
          description: e.g. sm_120, gfx1201
          type: string
        features:
          items:
            type: string
          type: array
        index:
          type: integer
        memory_bytes:
          format: int64
          type: integer
        name:
          type: string
        uuid:
          type: string
        vendor:
          description: Vendor-neutral capability field, e.g. nvidia, amd, intel
          type: string
      required:
        - index
        - vendor
        - name
        - uuid
        - memory_bytes
      type: object
    Artifact:
      properties:
        digest:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        identity:
          description: Canonical identity, e.g. hf://owner/repo@revision, sha256 digest, or OCI digest
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        metadata:
          additionalProperties: true
          type: object
        placements:
          items:
            $ref: '#/components/schemas/Placement'
          type: array
        revision:
          nullable: true
          type: string
        validation_state:
          enum:
            - pending
            - valid
            - invalid
          type: string
      required:
        - id
        - kind
        - identity
        - validation_state
      type: object
    ArtifactKind:
      enum:
        - model
        - dataset
        - adapter
        - checkpoint
        - recipe
        - image
        - result
        - file
      type: string
    BenchmarkCreate:
      properties:
        deployment_id:
          format: uuid
          type: string
        languages:
          items:
            type: string
          minItems: 1
          type: array
        max_tokens:
          default: 512
          type: integer
        model_name:
          description: Override the model field sent to the endpoint
          type: string
        prompts_per_language:
          default: 8
          type: integer
        quantization:
          type: string
        reason:
          description: Why this benchmark is being run; stored with the result
          type: string
        temperature:
          default: 0
          type: number
      required:
        - deployment_id
        - languages
      type: object
    BenchmarkResult:
      properties:
        completion_tokens:
          type: integer
        created_at:
          format: date-time
          type: string
        endpoint:
          type: string
        first_token_ms:
          additionalProperties:
            type: number
          type: object
        grading:
          additionalProperties: true
          nullable: true
          type: object
        language:
          type: string
        latency_ms:
          properties:
            avg:
              type: number
            p50:
              type: number
            p90:
              type: number
            p99:
              type: number
          type: object
        model:
          type: string
        prompt_tokens:
          type: integer
        quantization:
          nullable: true
          type: string
        reasoning:
          additionalProperties: true
          nullable: true
          type: object
        requests:
          type: integer
        result_path:
          nullable: true
          type: string
        run_id:
          format: uuid
          type: string
        successes:
          type: integer
        tokens_per_second:
          type: number
        total_tokens:
          type: integer
        wall_seconds:
          type: number
      required:
        - run_id
        - language
      type: object
    CertificateInfo:
      properties:
        expires_at:
          format: date-time
          type: string
        not_before:
          format: date-time
          type: string
        serial:
          type: string
      required:
        - expires_at
      type: object
    CodingTrace:
      properties:
        base_revision:
          type: string
        created_at:
          format: date-time
          type: string
        digest:
          type:
            - string
            - "null"
        experiment_id:
          type:
            - string
            - "null"
        failure_kind:
          type:
            - string
            - "null"
        final_diff:
          type:
            - string
            - "null"
        finished_at:
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        model:
          type: string
        model_source:
          enum:
            - lmw_deployment
            - external_api
          type: string
        pinned:
          type: boolean
        problem:
          type: string
        redaction_count:
          type: integer
        redaction_version:
          type: string
        repository:
          type: string
        run_id:
          type: string
        sampling:
          additionalProperties: true
          type: object
        scaffold:
          type: string
        schema_version:
          type: string
        state:
          enum:
            - recording
            - completed
            - interrupted
          type: string
        success_label:
          type:
            - boolean
            - "null"
        task_id:
          type: string
        token_count:
          type: integer
        turn_count:
          type: integer
      required:
        - id
        - run_id
        - task_id
        - problem
        - repository
        - base_revision
        - model_source
        - model
        - state
        - token_count
        - turn_count
        - pinned
        - schema_version
        - redaction_version
        - redaction_count
        - created_at
      type: object
    CodingTraceDetail:
      allOf:
        - $ref: '#/components/schemas/CodingTrace'
        - properties:
            verification:
              $ref: '#/components/schemas/TraceVerification'
          type: object
    CodingTracePage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CodingTrace'
          type: array
        next_cursor:
          type: string
      required:
        - items
        - next_cursor
      type: object
    CodingTraceSettings:
      properties:
        capture_reasoning:
          default: true
          type: boolean
        export_max_context_tokens:
          default: 32768
          maximum: 1048576
          minimum: 1024
          type: integer
        export_success_cap_per_task:
          default: 2
          maximum: 100
          minimum: 1
          type: integer
        retention_days:
          default: 0
          maximum: 3650
          minimum: 0
          type: integer
      required:
        - capture_reasoning
        - retention_days
        - export_max_context_tokens
        - export_success_cap_per_task
      type: object
    Compatibility:
      properties:
        accelerator:
          additionalProperties: true
          type: object
        fabric:
          additionalProperties: true
          type: object
        node_count:
          type: integer
      type: object
    CreateEnrollmentTokenRequest:
      properties:
        description:
          type: string
      type: object
    CreateFabricRequest:
      properties:
        address:
          description: Interface address of the first member
          type: string
        interface_name:
          type: string
        members:
          description: Ordered node IDs; index is the fabric rank
          items:
            type: string
          minItems: 2
          type: array
        name:
          type: string
        rdma_device:
          nullable: true
          type: string
        transport:
          enum:
            - roce
            - tcp
          type: string
      required:
        - name
        - transport
        - members
      type: object
    Deployment:
      properties:
        created_at:
          format: date-time
          type: string
        desired_state:
          enum:
            - running
            - stopped
          type: string
        diagnostics:
          items:
            $ref: '#/components/schemas/Diagnostic'
          type: array
        endpoint:
          nullable: true
          properties:
            host:
              type: string
            model:
              type: string
            path:
              type: string
            port:
              type: integer
          type: object
        fabric:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        model_capabilities:
          additionalProperties: true
          nullable: true
          type: object
        observed_state:
          enum:
            - unknown
            - preparing
            - starting
            - healthy
            - degraded
            - stopping
            - stopped
            - failed
          type: string
        placements:
          items:
            properties:
              accelerator_index:
