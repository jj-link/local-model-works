components:
  parameters:
    AutoResearchIdeaId:
      in: path
      name: ideaId
      required: true
      schema:
        format: uuid
        type: string
    AutoResearchProjectId:
      in: path
      name: projectId
      required: true
      schema:
        format: uuid
        type: string
    AutoResearchRunId:
      in: path
      name: runId
      required: true
      schema:
        format: uuid
        type: string
    ID:
      in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource conflict (occupation, duplicate, stale state)
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource not found
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Required agent(s) unavailable
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Missing or invalid session
    Unprocessable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Incompatible plan or invalid input
  schemas:
    Accelerator:
      properties:
        architecture:
          description: e.g. sm_120, gfx1201
          type: string
        features:
          items:
            type: string
          type: array
        index:
          type: integer
        memory_bytes:
          format: int64
          type: integer
        name:
          type: string
        uuid:
          type: string
        vendor:
          description: Vendor-neutral capability field, e.g. nvidia, amd, intel
          type: string
      required:
        - index
        - vendor
        - name
        - uuid
        - memory_bytes
      type: object
    Artifact:
      properties:
        digest:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        identity:
          description: Canonical identity, e.g. hf://owner/repo@revision, sha256 digest, or OCI digest
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
