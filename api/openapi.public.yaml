          name: cursor
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunsPage'
          description: Runs, newest first
        "401":
          $ref: '#/components/responses/Unauthorized'
      tags:
        - runs
  /runs/{id}:
