        - auth
  /system/info:
    get:
      operationId: systemInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
          description: Server identity and fleet summary
        "401":
          $ref: '#/components/responses/Unauthorized'
      tags:
        - system
  /transfers:
    get:
      operationId: listTransfers
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Transfer'
                type: array
          description: Transfers
        "401":
          $ref: '#/components/responses/Unauthorized'
      tags:
        - artifacts
    post:
      operationId: createTransfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
          description: Transfer started
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/Unprocessable'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Plan and start a peer transfer of an artifact between nodes
      tags:
        - artifacts
  /transfers/{id}:
    delete:
      operationId: cancelTransfer
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
          description: Transfer cancelled; resumable temporary state preserved
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
      tags:
        - artifacts
    get:
      operationId: getTransfer
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
          description: Transfer
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
      tags:
        - artifacts
components:
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema:
        type: string
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
  responses:
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource conflict (occupation, duplicate, stale state)
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource not found
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Required agent(s) unavailable
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Missing or invalid session
    Unprocessable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Incompatible plan or invalid input
  schemas:
    Accelerator:
      properties:
        architecture:
          description: e.g. sm_120, gfx1201
          type: string
        features:
          items:
            type: string
          type: array
        index:
          type: integer
        memory_bytes:
          format: int64
          type: integer
        name:
          type: string
        uuid:
          type: string
        vendor:
          description: Vendor-neutral capability field, e.g. nvidia, amd, intel
          type: string
      required:
        - index
        - vendor
        - name
        - uuid
        - memory_bytes
      type: object
    Artifact:
      properties:
        digest:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        identity:
          description: Canonical identity, e.g. hf://owner/repo@revision, sha256 digest, or OCI digest
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        metadata:
          additionalProperties: true
          type: object
        placements:
          items:
            $ref: '#/components/schemas/Placement'
          type: array
        revision:
          nullable: true
          type: string
        validation_state:
          enum:
            - pending
            - valid
            - invalid
          type: string
      required:
        - id
        - kind
        - identity
        - validation_state
      type: object
    ArtifactKind:
      enum:
        - model
        - dataset
        - adapter
        - checkpoint
        - recipe
        - image
        - result
        - file
      type: string
    BenchmarkCatalogEntry:
      properties:
        benchmark_id:
          type: string
        dataset_locator:
          type: string
        harnesses:
          items:
            $ref: '#/components/schemas/BenchmarkCatalogHarness'
          type: array
        languages:
          items:
            type: string
          type: array
        reference_url:
          format: uri
          type: string
        source_checksum:
          type: string
        supports_repeated_candidates:
          type: boolean
        supports_task_filters:
          type: boolean
        supports_verifier:
          type: boolean
        task_count:
          type: integer
        task_ids:
          items:
            type: string
          type: array
        title:
          type: string
        version:
          type: string
      required:
        - benchmark_id
        - version
        - title
        - harnesses
        - task_count
        - supports_task_filters
        - supports_repeated_candidates
        - supports_verifier
      type: object
    BenchmarkCatalogHarness:
      properties:
        accepts_openai_compatible:
          type: boolean
        id:
          type: string
        requires_generation_deployment:
          type: boolean
        title:
          type: string
      required:
        - id
        - title
        - requires_generation_deployment
        - accepts_openai_compatible
      type: object
    BenchmarkCatalogResponse:
      properties:
        benchmarks:
          items:
            $ref: '#/components/schemas/BenchmarkCatalogEntry'
          type: array
        runner:
          $ref: '#/components/schemas/BenchmarkRunnerAvailability'
      required:
        - benchmarks
        - runner
      type: object
    BenchmarkCreate:
      additionalProperties: false
      oneOf:
        - not:
            anyOf:
              - required:
                  - task_ids
              - required:
                  - verification_deployment_id
              - required:
                  - verification_model
              - required:
                  - verifier_repetitions
              - required:
                  - verifier_pivots
          properties:
            benchmark_id:
              const: lmw-code-generation
            candidate_count:
              const: 1
            harness:
              const: lmw-oneshot
            version:
              const: "1"
          required:
            - generation_deployment_id
            - languages
          title: LMW code generation
        - not:
            anyOf:
              - required:
                  - generation_deployment_id
              - required:
                  - generation_model
              - required:
                  - verification_deployment_id
              - required:
                  - verification_model
              - required:
                  - verifier_repetitions
              - required:
                  - verifier_pivots
              - required:
                  - languages
              - required:
                  - prompts_per_language
              - required:
                  - max_tokens
              - required:
                  - temperature
          properties:
            benchmark_id:
              const: terminal-bench
            harness:
              const: oracle
            version:
              const: 3.0.0
          title: Terminal-Bench oracle
        - else:
            not:
              anyOf:
                - required:
                    - verification_model
                - required:
                    - verifier_repetitions
                - required:
                    - verifier_pivots
          if:
            required:
              - verification_deployment_id
          not:
            anyOf:
              - required:
                  - languages
              - required:
                  - prompts_per_language
              - required:
                  - max_tokens
              - required:
                  - temperature
          properties:
            benchmark_id:
              const: terminal-bench
            harness:
              enum:
                - codex
                - mini-swe-agent
            version:
              const: 3.0.0
          required:
            - generation_deployment_id
          then:
            properties:
              candidate_count:
                minimum: 2
          title: Terminal-Bench agent
      properties:
        benchmark_id:
          type: string
        candidate_count:
          default: 1
          maximum: 10
          minimum: 1
          type: integer
        concurrency:
          default: 1
          maximum: 32
          minimum: 1
          type: integer
        generation_deployment_id:
          format: uuid
          type: string
        generation_model:
          minLength: 1
          type: string
        harness:
          type: string
        languages:
          items:
            enum:
              - python
              - javascript
              - go
              - rust
              - cpp
              - java
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        max_tokens:
          default: 512
          maximum: 16384
          minimum: 16
          type: integer
        origin:
          $ref: '#/components/schemas/BenchmarkOriginInput'
        prompts_per_language:
          default: 8
          maximum: 256
          minimum: 1
          type: integer
        reason:
          type: string
        seed:
          default: 0
          type: integer
        task_ids:
          items:
            pattern: ^[A-Za-z0-9._-]+$
            type: string
          type: array
          uniqueItems: true
        temperature:
          default: 0
          maximum: 2
          minimum: 0
          type: number
        verification_deployment_id:
          format: uuid
          type: string
        verification_model:
          minLength: 1
          type: string
        verifier_pivots:
          maximum: 10
          minimum: 1
          type: integer
        verifier_repetitions:
          default: 8
          maximum: 32
          minimum: 1
          type: integer
        version:
          type: string
      required:
        - benchmark_id
        - version
        - harness
      type: object
    BenchmarkLanguageResult:
      properties:
        completion_tokens:
          type: integer
        created_at:
          format: date-time
          type: string
        endpoint:
          type: string
        first_token_ms:
          additionalProperties:
            type: number
          type: object
        grading:
          additionalProperties: true
          type: object
        language:
          type: string
        latency_ms:
          additionalProperties:
            type: number
          type: object
        model:
          type: string
        prompt_tokens:
          type: integer
        reasoning:
          additionalProperties: true
          type: object
        requests:
          type: integer
        result_path:
          type: string
        run_id:
          format: uuid
          type: string
        successes:
          type: integer
        tokens_per_second:
          type: number
        total_tokens:
          type: integer
        wall_seconds:
          type: number
      required:
        - run_id
        - language
        - requests
        - successes
        - prompt_tokens
        - completion_tokens
        - total_tokens
        - wall_seconds
        - tokens_per_second
        - created_at
      type: object
    BenchmarkOrigin:
      additionalProperties: false
      dependentRequired:
        project_id:
          - run_id
        run_id:
          - project_id
      properties:
        client_id:
          format: uuid
          type: string
        client_name:
          type: string
        project_id:
          format: uuid
          type: string
        run_id:
          format: uuid
          type: string
      required:
        - client_id
        - client_name
      type: object
    BenchmarkOriginInput:
      additionalProperties: false
      properties:
        project_id:
          format: uuid
          type: string
        run_id:
          format: uuid
          type: string
      required:
        - run_id
        - project_id
      type: object
    BenchmarkRunResult:
      properties:
        benchmark_id:
          type: string
        benchmark_version:
          type: string
        bundle_artifact_id:
          type: string
        candidate_count:
          type: integer
        completion_tokens:
          type: integer
        created_at:
          format: date-time
          type: string
        execution_node_id:
          format: uuid
          type: string
        generation_deployment_id:
          format: uuid
          type: string
        harness:
          type: string
        language_results:
          items:
            $ref: '#/components/schemas/BenchmarkLanguageResult'
          type: array
        metrics:
          additionalProperties: true
          type: object
        oracle_pass_rate:
          nullable: true
          type: number
        origin:
          $ref: '#/components/schemas/BenchmarkOrigin'
        pass_at_1:
          nullable: true
          type: number
        passed_count:
          type: integer
        prompt_tokens:
          type: integer
        run_id:
          format: uuid
          type: string
        summary_artifact_id:
          type: string
        task_count:
          type: integer
        total_tokens:
          type: integer
        verification_deployment_id:
          format: uuid
          type: string
        verifier_pass_rate:
          nullable: true
          type: number
        wall_seconds:
          type: number
      required:
        - run_id
        - benchmark_id
        - benchmark_version
        - harness
        - task_count
        - candidate_count
        - passed_count
        - prompt_tokens
        - completion_tokens
        - total_tokens
        - wall_seconds
        - metrics
        - language_results
        - created_at
      type: object
    BenchmarkRunSummary:
      properties:
        result:
          $ref: '#/components/schemas/BenchmarkRunResult'
        run:
          $ref: '#/components/schemas/Run'
      required:
        - run
        - result
      type: object
    BenchmarkRunnerAvailability:
      properties:
        configured:
          type: boolean
        max_concurrency:
          maximum: 32
          minimum: 1
          type: integer
        node_id:
          format: uuid
          type: string
        online:
          type: boolean
      required:
        - configured
        - online
        - max_concurrency
      type: object
    BenchmarkTrialResult:
      properties:
        candidate_index:
          type: integer
        created_at:
          format: date-time
          type: string
        metrics:
          additionalProperties: true
          type: object
        official_pass:
          type: boolean
        run_id:
          format: uuid
          type: string
        task_id:
          type: string
        trajectory_path:
          type: string
        verifier_score:
          nullable: true
          type: number
        verifier_selected:
          type: boolean
      required:
        - run_id
        - task_id
        - candidate_index
        - official_pass
        - verifier_selected
        - trajectory_path
        - metrics
        - created_at
      type: object
    BrowserLoginRequest:
      properties:
        token:
          type: string
      required:
        - token
      type: object
    CacheRoot:
      properties:
        backend:
          type: string
        path:
          type: string
        repositories:
          items:
            type: string
          type: array
        writable:
          description: Probed by the node agent through its own mount namespace. False means artifact fetches into this root will fail until the root is added to the agent service ReadWritePaths.
          type: boolean
      required:
        - path
        - backend
      type: object
    CertificateInfo:
      properties:
        expires_at:
          format: date-time
          type: string
        not_before:
          format: date-time
          type: string
        serial:
          type: string
      required:
        - expires_at
      type: object
    ChatAssistantMessage:
      additionalProperties: false
      properties:
        content:
          type: string
        reasoning_content:
          type: string
        role:
          const: assistant
          type: string
      required:
        - role
        - content
      type: object
    ChatCompletionRequest:
      additionalProperties: false
      properties:
        deployment_id:
          format: uuid
          type: string
        max_tokens:
          maximum: 32768
          minimum: 1
          type: integer
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          maxItems: 64
          minItems: 1
          type: array
        temperature:
          maximum: 2
          minimum: 0
          type: number
      required:
        - deployment_id
        - messages
      type: object
    ChatCompletionResponse:
      additionalProperties: false
      properties:
        finish_reason:
          type: string
        id:
          type: string
        message:
          $ref: '#/components/schemas/ChatAssistantMessage'
        model:
          type: string
        usage:
          $ref: '#/components/schemas/ChatUsage'
      required:
        - id
        - model
        - message
      type: object
    ChatMessage:
      additionalProperties: false
      properties:
        content:
          maxLength: 65536
          minLength: 1
          type: string
        role:
          enum:
            - system
            - user
            - assistant
