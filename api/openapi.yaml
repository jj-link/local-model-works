# Core control-plane OpenAPI. Module-owned paths and schemas live in
# modules/<id>/api.yaml fragments; "go run ./internal/generate/oapi gen"
# merges them into api/openapi.public.yaml (the validated public contract).
openapi: 3.1.0
info:
  title: Local Model Works
  version: 1.0.0
  description: >
    Control plane API for a self-hosted local-AI workshop. Single-operator.
    All mutations require a session cookie plus the X-CSRF-Token header.
    Errors use the structured Error shape; resource conflicts are 409,
    incompatible plans are 422, and unavailable required agents are 503.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: system
  - name: enrollment
  - name: migration
paths:
  /login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange username/password for a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Session cookie set
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        '204':
          description: Session ended
        '401':
          $ref: '#/components/responses/Unauthorized'

  /session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session metadata including the CSRF token
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /system/info:
    get:
      tags: [system]
      operationId: systemInfo
      responses:
        '200':
          description: Server identity and fleet summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /modules:
    get:
      tags: [system]
      operationId: listModules
      summary: Enabled first-party modules (descriptors present server- and client-side)
      responses:
        '200':
          description: Module descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events:
    get:
      tags: [system]
      operationId: streamEvents
      summary: Server-sent event stream (telemetry, job state, log tails)
      description: >
        Monotonic integer event IDs. Clients resume with Last-Event-ID;
        events older than the retention window are pruned and the stream
        resends from the oldest retained ID.
      parameters:
        - name: types
          in: query
          description: Comma-separated event type filter
          schema:
            type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /enrollment-tokens:
    post:
      tags: [enrollment]
      operationId: createEnrollmentToken
      summary: Create a one-use, ten-minute enrollment token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentTokenRequest'
      responses:
        '201':
          description: Token (plaintext shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [enrollment]
      operationId: listEnrollmentTokens
      responses:
        '200':
          description: Token list (hashed, no plaintext)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentToken'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /enrollment-tokens/{id}:
    delete:
      tags: [enrollment]
      operationId: deleteEnrollmentToken
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Token revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /migration/scan:
    post:
      tags: [migration]
      operationId: migrationScan
      summary: Scan the legacy DGX-Dashboard installation; returns a saved plan with digest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationScanRequest'
      responses:
        '200':
          description: Migration plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /migration/import:
    post:
      tags: [migration]
      operationId: migrationImport
      summary: Execute a previously saved, digested migration plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationImportRequest'
      responses:
        '200':
          description: Import report
          content:
            application/json:
              schema:
                type: object
                required: [imported, unsupported, counts]
                properties:
                  imported:
                    type: object
                  unsupported:
                    type: array
                    items:
                      type: string
                  counts:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict (occupation, duplicate, stale state)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Incompatible plan or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Required agent(s) unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code, e.g. node.occupied, plan.incompatible
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    Session:
      type: object
      required: [username, csrf_token, expires_at]
      properties:
        username:
          type: string
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time

    SystemInfo:
      type: object
      required: [version, commit, time, nodes]
      properties:
        version:
          type: string
        commit:
          type: string
        time:
          type: string
          format: date-time
        nodes:
          type: object
          properties:
            total:
              type: integer
            online:
              type: integer
            approved:
              type: integer

    Module:
      type: object
      required: [id, title, route]
      properties:
        id:
          type: string
        title:
          type: string
        route:
          type: string
        nav:
          type: object
          properties:
            label:
              type: string
            order:
              type: integer
            icon:
              type: string
        settingsSchema:
          type: object
          additionalProperties: true
        jobKinds:
          type: array
          items:
            type: string
        artifactKinds:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string

    CreateEnrollmentTokenRequest:
      type: object
      properties:
        description:
          type: string

    EnrollmentToken:
      type: object
      required: [id, expires_at]
      properties:
        id:
          type: string
        token:
          type: string
          description: Plaintext token; present only on creation
        description:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          nullable: true

    Diagnostic:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [info, warning, error]
        message:
          type: string
        resource:
          type: string
          nullable: true

    MigrationScanRequest:
      type: object
      properties:
        legacy_root:
          type: string
          description: Default /home/workbench/Projects/personal/dgx-dashboard
        cache_roots:
          type: array
          description: Per-node explicit cache roots; nodes without an entry use agent-reported roots
          items:
            type: object
            required: [node_id, path]
            properties:
              node_id:
                type: string
              path:
                type: string

    MigrationPlan:
      type: object
      required: [plan_digest, counts, recipes, unsupported]
      properties:
        plan_digest:
          type: string
        counts:
          type: object
          properties:
            recipes_discovered:
              type: integer
            recipes_importable:
              type: integer
            unsupported:
              type: integer
            runs:
              type: integer
            runs_nonterminal:
              type: integer
            benchmark_results:
              type: integer
            containers_current:
              type: integer
        recipes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              version:
                type: string
              kind:
                type: string
                enum: [single, cluster, unsupported]
              image_refs:
                type: array
                items:
                  type: string
              mutable_images:
                type: array
                items:
                  type: string
              status:
                type: string
                enum: [importable, needs-digest-pin, unsupported]
              reason:
                type: string
        runs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              state:
                type: string
              terminal:
                type: boolean
        unsupported:
          type: array
          items:
            type: string
        cache_placements:
          type: array
          items:
            type: object
            properties:
              node_id:
                type: string
              path:
                type: string
              valid:
                type: boolean

    MigrationImportRequest:
      type: object
      required: [plan_digest]
      properties:
        plan_digest:
          type: string
        confirm:
          type: boolean
          default: false
