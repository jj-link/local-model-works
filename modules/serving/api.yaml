# OpenAPI fragment for the serving module. Merged into the public contract by
# "go run ./internal/generate/oapi gen"; $refs resolve in the merged document.
openapi: 3.1.0
info:
  title: Local Model Works serving fragment
  version: 1.0.0
tags:
  - name: deployments
paths:
  /deployments/plan:
    post:
      tags: [deployments]
      operationId: planDeployment
      summary: "Preview a deployment: placement, artifact preparation, ports, risks, conflicts"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentPlanRequest'
      responses:
        '200':
          description: Deployment plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /deployments:
    post:
      tags: [deployments]
      operationId: createDeployment
      summary: Create and start a deployment from a validated plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreateRequest'
      responses:
        '201':
          description: Deployment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [deployments]
      operationId: listDeployments
      responses:
        '200':
          description: Deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deployment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deployments/{id}:
    get:
      tags: [deployments]
      operationId: getDeployment
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [deployments]
      operationId: deleteDeployment
      summary: Delete a fully-stopped deployment and its runs, freeing the slot
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Deployment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /deployments/{id}/verify:
    post:
      tags: [deployments]
      operationId: verifyDeployment
      summary: Run the recipe's verification probes against the live workload
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Deployment with verification diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /deployments/{id}/stop:
    post:
      tags: [deployments]
      operationId: stopDeployment
      summary: Stop exactly this deployment's workload (label-scoped)
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Deployment with stopping/stopped state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /deployments/{id}/start:
    post:
      tags: [deployments]
      operationId: startDeployment
      summary: Restart a fully-stopped deployment, re-acquiring leases and re-dispatching
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Deployment restarted (running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /deployments/{id}/logs:
    get:
      tags: [deployments]
      operationId: deploymentLogs
      summary: Stream workload logs (SSE); byte-cursor resume via Last-Event-ID
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: rank
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Log stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /deployments/telemetry:
    get:
      tags: [deployments]
      operationId: listDeploymentTelemetry
      summary: Latest typed serving telemetry sample per deployment
      responses:
        '200':
          description: Latest serving samples sorted by deployment_id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServingTelemetrySample'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deployments/{id}/telemetry:
    get:
      tags: [deployments]
      operationId: getDeploymentTelemetry
      summary: Ranged serving telemetry history for one deployment
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: resolution
          in: query
          schema: { type: string, enum: [5s, 1m], default: 5s }
        - name: from
          in: query
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 2000 }
      responses:
        '200':
          description: Ordered serving samples (empty for an unknown deployment)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServingTelemetrySample'
        '401':
          $ref: '#/components/responses/Unauthorized'


components:
  schemas:
    DeploymentPlanRequest:
      type: object
      required: [recipe_digest, profile]
      properties:
        recipe_digest:
          type: string
        profile:
          type: string
        placements:
          type: array
          description: Optional explicit node per rank; omit for automatic selection
          items:
            type: object
            required: [node_id, rank]
            properties:
              node_id:
                type: string
                format: uuid
              rank:
                type: integer
        variants:
          type: object
          additionalProperties:
            type: string
          description: "Optional artifact name -> selected model variant. Omit for the recipe default."

    TransferPreview:
      type: object
      required: [artifact_id, source_node, dest_node, dest_path, bytes]
      properties:
        artifact_id:
          type: string
          format: uuid
        identity:
          type: string
        source_node:
          type: string
        source_path:
          type: string
        dest_node:
          type: string
        dest_path:
          type: string
        bytes:
          type: integer
          format: int64
        network:
          type: string
          description: Network path, e.g. fabric spark-p2p (roce), tailnet, local

    DeploymentPlan:
      type: object
      required: [recipe_digest, profile, placements, ready]
      properties:
        plan_digest:
          type: string
          description: Opaque digest for this previewed plan; pass to create to pin it
        variants:
          type: object
          additionalProperties:
            type: string
          description: Resolved per-artifact model variants
        workload_index:
          type: integer
          nullable: true
          description: Workload identity for accelerator tuning
        recipe_digest:
          type: string
        recipe_name:
          type: string
        recipe_version:
          type: string
        profile:
          type: string
        placements:
          type: array
          items:
            type: object
            required: [node_id, rank, accelerator_index]
            properties:
              node_id:
                type: string
                format: uuid
              node_name:
                type: string
              rank:
                type: integer
              accelerator_index:
                type: integer
              accelerator_uuid:
                type: string
        fabric:
          type: string
          nullable: true
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/TransferPreview'
        ports:
          type: array
          items:
            type: object
            required: [node_id, host_port, container_port]
            properties:
              node_id:
                type: string
                format: uuid
              node_name:
                type: string
              host_port:
                type: integer
              container_port:
                type: integer
              protocol:
                type: string
        endpoint:
          type: object
          properties:
            host:
              type: string
            port:
              type: integer
            path:
              type: string
            model:
              type: string
        risks:
          type: array
          items:
            type: string
        conflicts:
          type: array
          items:
            type: object
            properties:
              resource:
                type: string
              occupied_by:
                type: string
              deployment_id:
                type: string
                format: uuid
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        ready:
          type: boolean
          description: false when conflicts or unmet compatibility block creation

    DeploymentCreateRequest:
      type: object
      required: [recipe_digest, profile]
      properties:
        recipe_digest:
          type: string
        profile:
          type: string
        placements:
          type: array
          items:
            type: object
            required: [node_id, rank]
            properties:
              node_id:
                type: string
                format: uuid
              rank:
                type: integer
        plan_digest:
          type: string
          description: Distinguishes an unchanged plan from the one previewed
        variants:
          type: object
          additionalProperties:
            type: string
          description: "Optional artifact name -> selected model variant. Must match the previewed plan."

    Deployment:
      type: object
      required: [id, recipe_digest, profile, desired_state, observed_state]
      properties:
        id:
          type: string
          format: uuid
        recipe_digest:
          type: string
        recipe_name:
          type: string
        recipe_version:
          type: string
        profile:
          type: string
        placements:
          type: array
          items:
            type: object
            required: [node_id, rank]
            properties:
              node_id:
                type: string
                format: uuid
              node_name:
                type: string
              rank:
                type: integer
              accelerator_index:
                type: integer
              container:
                type: string
                nullable: true
        fabric:
          type: string
          nullable: true
        desired_state:
          type: string
          enum: [running, stopped]
        observed_state:
          type: string
          enum: [unknown, preparing, starting, healthy, degraded, stopping, stopped, failed]
        endpoint:
          type: object
          nullable: true
          properties:
            host:
              type: string
            port:
              type: integer
            path:
              type: string
            model:
              type: string
        model_capabilities:
          type: object
          nullable: true
          additionalProperties: true
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        run_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServingTelemetrySample:
      type: object
      required: [deployment_id, ts, payload]
      properties:
        deployment_id: { type: string, format: uuid }
        ts: { type: integer, format: int64 }
        payload:
          $ref: '#/components/schemas/ServingPayload'
    ServingPayload:
      type: object
      properties:
        available: { type: boolean }
        backend: { type: string }
        model_id: { type: string }
        generation_tps: { type: number, format: double, nullable: true }
        prefill_tps: { type: number, format: double, nullable: true }
        requests_running: { type: integer, format: int64 }
        requests_waiting: { type: integer, format: int64 }
        slots_active: { type: integer, format: int64 }
        slots_total: { type: integer, format: int64 }
        kv_cache_usage_ratio: { type: number, format: double, nullable: true }
        prefix_cache_hit_ratio: { type: number, format: double, nullable: true }
        ttft_p95_seconds: { type: number, format: double, nullable: true }
        e2e_p95_seconds: { type: number, format: double, nullable: true }
        itl_p95_seconds: { type: number, format: double, nullable: true }
        preemptions_total: { type: integer, format: int64 }
        spec_acceptance_ratio: { type: number, format: double, nullable: true }
        context_length: { type: integer, format: int64 }
        error_code: { type: string, nullable: true }
        error: { type: string, nullable: true }
