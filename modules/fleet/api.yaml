# OpenAPI fragment for the fleet module. Merged into the public contract by
# "go run ./internal/generate/oapi gen"; $refs resolve in the merged document.
openapi: 3.1.0
info:
  title: Local Model Works fleet fragment
  version: 1.0.0
tags:
  - name: nodes
  - name: fabrics
paths:
  /nodes:
    get:
      tags: [nodes]
      operationId: listNodes
      responses:
        '200':
          description: Enrolled nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /nodes/{id}:
    get:
      tags: [nodes]
      operationId: getNode
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Node with inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [nodes]
      operationId: updateNode
      summary: Set display name and labels
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeRequest'
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /nodes/{id}/telemetry:
    get:
      tags: [nodes]
      operationId: getNodeTelemetry
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: resolution
          in: query
          schema: { type: string, enum: [5s, 1m], default: 5s }
        - name: from
          in: query
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 2000 }
      responses:
        '200':
          description: Ordered telemetry samples
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeTelemetrySample'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /nodes/{id}/approve:
    post:
      tags: [nodes]
      operationId: approveNode
      summary: Approve a pending node's reported inventory
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Approved node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /nodes/{id}/rotate-certificate:
    post:
      tags: [nodes]
      operationId: rotateNodeCertificate
      summary: Issue a fresh 90-day client certificate for the node
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Certificate issued (agent picks it up on next session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /nodes/telemetry:
    get:
      tags: [nodes]
      operationId: listNodeTelemetry
      summary: Latest typed telemetry sample per node
      responses:
        '200':
          description: Latest node samples sorted by node_id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeTelemetrySample'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /fabrics:
    get:
      tags: [fabrics]
      operationId: listFabrics
      responses:
        '200':
          description: Fabrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fabric'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [fabrics]
      operationId: createFabric
      parameters:
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFabricRequest'
      responses:
        '201':
          description: Fabric created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fabric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /fabrics/{id}:
    get:
      tags: [fabrics]
      operationId: getFabric
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Fabric with member validation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fabric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [fabrics]
      operationId: updateFabric
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFabricRequest'
      responses:
        '200':
          description: Fabric updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fabric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [fabrics]
      operationId: deleteFabric
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Fabric deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  schemas:
    NodeStatus:
      type: string
      enum: [pending, online, offline, degraded]

    Node:
      type: object
      required: [id, display_name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        agent_version:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/NodeStatus'
        last_heartbeat:
          type: string
          format: date-time
          nullable: true
        certificate_expires_at:
          type: string
          format: date-time
          nullable: true
        inventory:
          $ref: '#/components/schemas/Inventory'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        created_at:
          type: string
          format: date-time

    Inventory:
      type: object
      required: [hostname, os, arch, docker]
      properties:
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
        docker:
          type: object
          required: [version, ok]
          properties:
            version:
              type: string
            api_version:
              type: string
            ok:
              type: boolean
        accelerators:
          type: array
          items:
            $ref: '#/components/schemas/Accelerator'
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/NetworkInterface'
        rdma_devices:
          type: array
          items:
            $ref: '#/components/schemas/RdmaDevice'
        cache_roots:
          type: array
          items:
            $ref: '#/components/schemas/CacheRoot'
        peer_listen:
          type: string

    CacheRoot:
      type: object
      required: [path, backend]
      properties:
        path:
          type: string
        backend:
          type: string
        size_bytes:
          type: integer
          format: int64
        repositories:
          type: array
          items:
            type: string

    Accelerator:
      type: object
      required: [index, vendor, name, uuid, memory_bytes]
      properties:
        index:
          type: integer
        vendor:
          type: string
          description: Vendor-neutral capability field, e.g. nvidia, amd, intel
        architecture:
          type: string
          description: e.g. sm_120, gfx1201
        name:
          type: string
        uuid:
          type: string
        memory_bytes:
          type: integer
          format: int64
        features:
          type: array
          items:
            type: string

    NetworkInterface:
      type: object
      required: [name, addresses]
      properties:
        name:
          type: string
        addresses:
          type: array
          items:
            type: string
        mtu:
          type: integer
        link_mbps:
          type: integer

    RdmaGID:
      type: object
      required: [index, value]
      properties:
        index:
          type: integer
        value:
          type: string
        type:
          type: string

    RdmaDevice:
      type: object
      required: [name, ports]
      properties:
        name:
          type: string
        vendor:
          type: string
        network_interfaces:
          type: array
          items:
            type: string
        ports:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              state:
                type: string
              link_rate_gbps:
                type: integer
              gids:
                type: array
                items:
                  $ref: '#/components/schemas/RdmaGID'
    UpdateNodeRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string

    CertificateInfo:
      type: object
      required: [expires_at]
      properties:
        serial:
          type: string
        not_before:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    FabricBinding:
      type: object
      required: [node_id, interface_name, address]
      properties:
        node_id:
          type: string
          format: uuid
        interface_name:
          type: string
        address:
          type: string
        rdma_device:
          type: string
        gid_index:
          type: integer
          minimum: 0
          maximum: 255

    CreateFabricRequest:
      type: object
      required: [name, transport, members, bindings]
      properties:
        name:
          type: string
        transport:
          type: string
          enum: [roce, tcp]
        members:
          type: array
          description: Ordered node IDs; index is the fabric rank
          minItems: 2
          items:
            type: string
        bindings:
          type: array
          description: Node-specific transport wiring in member/rank order
          minItems: 2
          items:
            $ref: '#/components/schemas/FabricBinding'

    Fabric:
      type: object
      required: [id, name, transport, members, bindings, state]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        transport:
          type: string
          enum: [roce, tcp]
        members:
          type: array
          items:
            type: string
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/FabricBinding'
        state:
          type: string
          enum: [ok, incomplete]
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        version:
          type: string
          description: ETag for optimistic concurrency
    TelemetrySample:
      type: object
      required: [node_id, ts, payload]
      properties:
        node_id: { type: string, format: uuid }
        ts: { type: integer, format: int64 }
        payload:
          type: object
          additionalProperties: true

    NodeTelemetrySample:
      type: object
      required: [node_id, ts, payload]
      properties:
        node_id: { type: string, format: uuid }
        ts: { type: integer, format: int64 }
        payload:
          $ref: '#/components/schemas/NodePayload'
    NodePayload:
      type: object
      properties:
        cpu:
          type: object
          properties:
            usage_percent: { type: integer, format: int64 }
            cores: { type: integer, format: int64 }
            load1: { type: integer, format: int64 }
        memory:
          type: object
          properties:
            used_bytes: { type: integer, format: int64 }
            total_bytes: { type: integer, format: int64 }
            swap_used_bytes: { type: integer, format: int64 }
            swap_total_bytes: { type: integer, format: int64 }
            swappiness: { type: integer, format: int32 }
        uptime_seconds: { type: integer, format: int64 }
        network:
          type: object
          properties:
            rx_bytes: { type: integer, format: int64 }
            tx_bytes: { type: integer, format: int64 }
            rx_bytes_per_second: { type: integer, format: int64 }
            tx_bytes_per_second: { type: integer, format: int64 }
            interfaces:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  rx_bytes_per_second: { type: integer, format: int64 }
                  tx_bytes_per_second: { type: integer, format: int64 }
        filesystems:
          type: array
          items:
            type: object
            properties:
              mount_path: { type: string }
              used_bytes: { type: integer, format: int64 }
              total_bytes: { type: integer, format: int64 }
        accelerators:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              utilization_percent: { type: integer, format: int64 }
              memory_used_bytes: { type: integer, format: int64 }
              memory_total_bytes: { type: integer, format: int64 }
              temperature_c: { type: integer, format: int64 }
              power_mw: { type: integer, format: int64 }
              power_limit_mw: { type: integer, format: int64 }
              throttle_reasons:
                type: array
                items: { type: string }
              processes:
                type: array
                items:
                  type: object
                  properties:
                    pid: { type: integer, format: int64 }
                    name: { type: string }
                    used_gpu_memory_bytes: { type: integer, format: int64 }
