apiVersion: localmodelworks/v1alpha1
kind: Module
id: benchmarks
title: Benchmarks
route: /benchmarks
nav:
  label: Benchmarks
  order: 40
  icon: benchmarks
settingsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    default_prompts_per_language:
