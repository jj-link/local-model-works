# OpenAPI fragment for the benchmarks module. Merged into the public contract
# by "go run ./internal/generate/oapi gen"; $refs resolve in the merged
# document (Run lives in the runs fragment).
openapi: 3.1.0
info:
  title: Local Model Works benchmarks fragment
  version: 1.0.0
tags:
  - name: benchmarks
paths:
  /benchmarks/catalog:
    get:
      tags: [benchmarks]
      operationId: getBenchmarkCatalog
      summary: List pinned benchmarks and live local runner availability
      responses:
        '200':
          description: Benchmark catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /benchmarks:
    post:
      tags: [benchmarks]
      operationId: createBenchmark
      summary: Launch a benchmark run against a deployment or explicit endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchmarkCreate'
      responses:
        '201':
          description: Benchmark run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [benchmarks]
      operationId: listBenchmarks
      parameters:
        - name: origin_run_id
          in: query
          schema:
            type: string
            format: uuid
        - name: origin_project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Benchmark runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
          headers:
            X-Next-Cursor:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /benchmarks/results:
    get:
      tags: [benchmarks]
      operationId: listBenchmarkResults
      responses:
        '200':
          description: Benchmark run summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenchmarkRunSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'


  /benchmarks/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [benchmarks]
      operationId: getBenchmark
      summary: Get one benchmark run and its live summary
      responses:
        '200':
          description: Benchmark run summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkRunSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /benchmarks/{runId}/cancel:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [benchmarks]
      operationId: cancelBenchmark
      summary: Cancel a non-terminal benchmark run
      responses:
        '202':
          description: Benchmark cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /benchmarks/{runId}/trials:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [benchmarks]
      operationId: listBenchmarkTrials
      summary: List normalized trials for one benchmark run
      responses:
        '200':
          description: Benchmark trials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenchmarkTrialResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /benchmarks/{runId}/bundle:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [benchmarks]
      operationId: downloadBenchmarkBundle
      summary: Download a succeeded benchmark result bundle
      responses:
        '200':
          description: Benchmark result bundle
          headers:
            Content-Disposition:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /benchmarks/{runId}/summary:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [benchmarks]
      operationId: downloadBenchmarkSummary
      summary: Download a succeeded benchmark summary
      responses:
        '200':
          description: Immutable benchmark summary JSON
          headers:
            ETag:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  schemas:
    BenchmarkCatalogResponse:
      type: object
      required: [benchmarks, runner]
      properties:
        benchmarks:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkCatalogEntry'
        runner:
          $ref: '#/components/schemas/BenchmarkRunnerAvailability'

    BenchmarkCatalogEntry:
      type: object
      required:
        - benchmark_id
        - version
        - title
        - harnesses
        - task_count
        - supports_task_filters
        - supports_repeated_candidates
        - supports_verifier
      properties:
        benchmark_id:
          type: string
        version:
          type: string
        title:
          type: string
        harnesses:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkCatalogHarness'
        dataset_locator:
          type: string
        source_checksum:
          type: string
        task_count:
          type: integer
        reference_url:
          type: string
          format: uri
        languages:
          type: array
          items:
            type: string
        task_ids:
          type: array
          items:
            type: string
        supports_task_filters:
          type: boolean
        supports_repeated_candidates:
          type: boolean
        supports_verifier:
          type: boolean

    BenchmarkCatalogHarness:
      type: object
      required: [id, title, requires_generation_deployment, accepts_openai_compatible]
      properties:
        id:
          type: string
        title:
          type: string
        requires_generation_deployment:
          type: boolean
        accepts_openai_compatible:
          type: boolean

    BenchmarkRunnerAvailability:
      type: object
      required: [configured, online, max_concurrency]
      properties:
        configured:
          type: boolean
        online:
          type: boolean
        node_id:
          type: string
          format: uuid
        max_concurrency:
          type: integer
          minimum: 1
          maximum: 32

    BenchmarkCreate:
      type: object
      additionalProperties: false
      required: [benchmark_id, version, harness]
      properties:
        benchmark_id:
          type: string
        version:
          type: string
        harness:
          type: string
        generation_deployment_id:
          type: string
          format: uuid
        generation_model:
          type: string
          minLength: 1
        verification_deployment_id:
          type: string
          format: uuid
        verification_model:
          type: string
          minLength: 1
        origin:
          $ref: '#/components/schemas/BenchmarkOriginInput'
        task_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9._-]+$'
        candidate_count:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        concurrency:
          type: integer
          minimum: 1
          maximum: 32
          default: 1
        seed:
          type: integer
          default: 0
        verifier_repetitions:
          type: integer
          minimum: 1
          maximum: 32
          default: 8
        verifier_pivots:
          type: integer
          minimum: 1
          maximum: 10
        languages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [python, javascript, go, rust, cpp, java]
        prompts_per_language:
          type: integer
          minimum: 1
          maximum: 256
          default: 8
        max_tokens:
          type: integer
          minimum: 16
          maximum: 16384
          default: 512
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0
        reason:
          type: string
      oneOf:
        - title: LMW code generation
          required: [generation_deployment_id, languages]
          properties:
            benchmark_id:
              const: lmw-code-generation
            version:
              const: '1'
            harness:
              const: lmw-oneshot
            candidate_count:
              const: 1
          not:
            anyOf:
              - required: [task_ids]
              - required: [verification_deployment_id]
              - required: [verification_model]
              - required: [verifier_repetitions]
              - required: [verifier_pivots]
        - title: Terminal-Bench oracle
          properties:
            benchmark_id:
              const: terminal-bench
            version:
              const: 3.0.0
            harness:
              const: oracle
          not:
            anyOf:
              - required: [generation_deployment_id]
              - required: [generation_model]
              - required: [verification_deployment_id]
              - required: [verification_model]
              - required: [verifier_repetitions]
              - required: [verifier_pivots]
              - required: [languages]
              - required: [prompts_per_language]
              - required: [max_tokens]
              - required: [temperature]
        - title: Terminal-Bench agent
          required: [generation_deployment_id]
          properties:
            benchmark_id:
              const: terminal-bench
            version:
              const: 3.0.0
            harness:
              enum: [codex, mini-swe-agent]
          not:
            anyOf:
              - required: [languages]
              - required: [prompts_per_language]
              - required: [max_tokens]
              - required: [temperature]
          if:
            required: [verification_deployment_id]
          then:
            properties:
              candidate_count:
                minimum: 2
          else:
            not:
              anyOf:
                - required: [verification_model]
                - required: [verifier_repetitions]
                - required: [verifier_pivots]

    BenchmarkOriginInput:
      type: object
      additionalProperties: false
      required: [run_id, project_id]
      properties:
        run_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid

    BenchmarkOrigin:
      type: object
      additionalProperties: false
      required: [client_id, client_name]
      properties:
        client_id:
          type: string
          format: uuid
        client_name:
          type: string
        run_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
      dependentRequired:
        run_id: [project_id]
        project_id: [run_id]

    BenchmarkRunSummary:
      type: object
      required: [run, result]
      properties:
        run:
          $ref: '#/components/schemas/Run'
        result:
          $ref: '#/components/schemas/BenchmarkRunResult'

    BenchmarkRunResult:
      type: object
      required:
        - run_id
        - benchmark_id
        - benchmark_version
        - harness
        - task_count
        - candidate_count
        - passed_count
        - prompt_tokens
        - completion_tokens
        - total_tokens
        - wall_seconds
        - metrics
        - language_results
        - created_at
      properties:
        run_id:
          type: string
          format: uuid
        benchmark_id:
          type: string
        benchmark_version:
          type: string
        harness:
          type: string
        generation_deployment_id:
          type: string
          format: uuid
        verification_deployment_id:
          type: string
          format: uuid
        origin:
          $ref: '#/components/schemas/BenchmarkOrigin'
        execution_node_id:
          type: string
          format: uuid
        task_count:
          type: integer
        candidate_count:
          type: integer
        passed_count:
          type: integer
        pass_at_1:
          type: number
          nullable: true
        verifier_pass_rate:
          type: number
          nullable: true
        oracle_pass_rate:
          type: number
          nullable: true
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        wall_seconds:
          type: number
        summary_artifact_id:
          type: string
        bundle_artifact_id:
          type: string
        metrics:
          type: object
          additionalProperties: true
        language_results:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkLanguageResult'
        created_at:
          type: string
          format: date-time

    BenchmarkLanguageResult:
      type: object
      required:
        - run_id
        - language
        - requests
        - successes
        - prompt_tokens
        - completion_tokens
        - total_tokens
        - wall_seconds
        - tokens_per_second
        - created_at
      properties:
        run_id:
          type: string
          format: uuid
        language:
          type: string
        endpoint:
          type: string
        model:
          type: string
        requests:
          type: integer
        successes:
          type: integer
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        wall_seconds:
          type: number
        tokens_per_second:
          type: number
        latency_ms:
          type: object
          additionalProperties:
            type: number
        first_token_ms:
          type: object
          additionalProperties:
            type: number
        grading:
          type: object
          additionalProperties: true
        reasoning:
          type: object
          additionalProperties: true
        result_path:
          type: string
        created_at:
          type: string
          format: date-time

    BenchmarkTrialResult:
      type: object
      required:
        - run_id
        - task_id
        - candidate_index
        - official_pass
        - verifier_selected
        - trajectory_path
        - metrics
        - created_at
      properties:
        run_id:
          type: string
          format: uuid
        task_id:
          type: string
        candidate_index:
          type: integer
        official_pass:
          type: boolean
        verifier_selected:
          type: boolean
        verifier_score:
          type: number
          nullable: true
        trajectory_path:
          type: string
        metrics:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
