apiVersion: localmodelworks/v1alpha1
kind: Module
id: library
title: Library
route: /library
nav:
  label: Library
  order: 20
  icon: library
settingsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    catalog_urls:
      type: array
      items:
        type: string
        format: uri
    assistant:
      type: object
      additionalProperties: false
      properties:
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label, kind, base_url, model]
            properties:
              id: {type: string, minLength: 1, not: {pattern: '^(local:|codex:)'}}
              label: {type: string, minLength: 1}
              kind: {const: openai_compatible}
              base_url: {type: string, minLength: 1}
              model: {type: string, minLength: 1}
              api_key_secret_id: {type: string, minLength: 1}
jobKinds:
  - recipe-import
  - recipe-draft
  - recipe-change
  - recipe-generate
  - recipe-resolve
  - recipe-download
  - recipe-package
  - recipe-install
artifactKinds:
  - model
  - dataset
  - adapter
  - checkpoint
  - recipe
  - file
apiFragment: api.yaml
capabilities:
  - recipes.write
  - artifacts.read
  - transfers.write
  - secrets.read
  - events.publish
