        selected_source_assets: {type: array, items: {$ref: '#/components/schemas/RecipeDraftAssetSelection'}}
        questions: {type: array, items: {$ref: '#/components/schemas/RecipeDraftQuestion'}}
        evidence:
          type: array
          items:
            type: object
