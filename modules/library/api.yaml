              source_commit: {type: string}
              start_line: {type: integer}
              end_line: {type: integer}
        summary: {type: string}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/RecipeDraftDiagnostic'}}
        preview_sha256: {type: string}
    RecipeResolvedReference:
      type: object
      required: [path, input_identity, resolved_value, origin, verified_at]
      properties:
        path: {type: string}
