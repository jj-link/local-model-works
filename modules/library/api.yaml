# OpenAPI fragment for the library module. Merged into the public contract by
# "go run ./internal/generate/oapi gen"; $refs resolve in the merged document.
openapi: 3.1.0
info:
  title: Local Model Works library fragment
  version: 1.0.0
tags:
  - name: artifacts
  - name: recipes
paths:
  /artifacts:
    get:
      tags: [artifacts]
      operationId: listArtifacts
      parameters:
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/ArtifactKind'
        - name: node
          in: query
          description: Only artifacts with a placement on this node
          schema:
            type: string
      responses:
        '200':
          description: Artifacts with placements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artifact'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /artifacts/{id}/placements:
    get:
      tags: [artifacts]
      operationId: listArtifactPlacements
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Placements for the artifact
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Placement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /transfers:
    post:
      tags: [artifacts]
      operationId: createTransfer
      summary: Plan and start a peer transfer of an artifact between nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Transfer started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [artifacts]
      operationId: listTransfers
      responses:
        '200':
          description: Transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/{id}:
    get:
      tags: [artifacts]
      operationId: getTransfer
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [artifacts]
      operationId: cancelTransfer
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Transfer cancelled; resumable temporary state preserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recipe-repositories:
    get:
      tags: [recipes]
      operationId: listRecipeRepositories
      responses:
        '200':
          description: One logical recipe per normalized Git repository and source path
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeRepository'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recipe-repositories/{id}:
    get:
      tags: [recipes]
      operationId: getRecipeRepository
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repository recipe and hardware using older versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeRepositoryDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /recipe-repositories/{id}/update/plan:
    post:
      tags: [recipes]
      operationId: planRecipeRepositoryUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeRepositoryUpdatePlanRequest'
      responses:
        '200':
          description: Exact hardware replacement preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeUpdatePlan'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /recipe-repositories/{id}/update:
    post:
      tags: [recipes]
      operationId: startRecipeRepositoryUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeRepositoryUpdateRequest'
      responses:
        '202':
          description: Durable recipe update run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeUpdateAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /recipes:
    get:
      tags: [recipes]
      operationId: listRecipes
      responses:
        '200':
          description: Installed recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'


  /recipes/check-updates:
    post:
      tags: [recipes]
      operationId: checkRecipeUpdates
      summary: Refresh cached upstream Git update status for installed recipes
      responses:
        '200':
          description: Refreshed recipe update states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeUpdateStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /recipes/import:
    post:
      tags: [recipes]
      operationId: importRecipe
      summary: Install a recipe from catalog, OCI reference, or pinned Git source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeImport'
      responses:
        '201':
          description: Installed recipe (trust untrusted unless verified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /recipes/{digest}:
    get:
      tags: [recipes]
      operationId: getRecipe
      parameters:
        - name: digest
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full recipe manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [recipes]
      operationId: deleteRecipe
      summary: Uninstall; blocked while referenced by any deployment or run
      parameters:
        - name: digest
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Recipe uninstalled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /recipes/{digest}/trust:
    post:
      tags: [recipes]
      operationId: setRecipeTrust
      summary: Approve trust (local) after reviewing the permission diff
      parameters:
        - name: digest
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeTrustRequest'
      responses:
        '200':
          description: Recipe with updated trust state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /recipe-drafts:
    get:
      tags: [recipes]
      operationId: listRecipeDrafts
      responses:
        '200':
          description: Inspectable recipe drafts
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/RecipeDraft'}}
    post:
      tags: [recipes]
      operationId: createRecipeDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecipeDraftSource'}
      responses:
        '202':
          description: Draft analysis job accepted
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties: {run_id: {type: string}}

  /recipe-drafts/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      tags: [recipes]
      operationId: getRecipeDraft
      responses:
        '200': {description: Recipe draft, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeDraft'}}}}
    put:
      tags: [recipes]
      operationId: updateRecipeDraft
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, selected_assets]
              properties:
                manifest: {type: object}
                selected_assets: {type: array, items: {type: string}}
      responses:
        '200': {description: Updated draft, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeDraft'}}}}
    delete:
      tags: [recipes]
      operationId: deleteRecipeDraft
      responses: {'204': {description: Draft deleted}}

  /recipe-drafts/{id}/package:
    post:
      tags: [recipes]
      operationId: packageRecipeDraft
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Packaged draft, content: {application/json: {schema: {$ref: '#/components/schemas/RecipeDraft'}}}}

  /recipe-drafts/{id}/install:
    post:
      tags: [recipes]
      operationId: installRecipeDraft
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_diff_accepted]
              properties: {permission_diff_accepted: {type: boolean}}
      responses:
        '201': {description: Installed recipe, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}

components:
  schemas:
    RecipeDraftSource:
      type: object
      additionalProperties: false
      required: [remote, revision]
      properties:
        remote: {type: string}
        revision: {type: string}
        path: {type: string}
    RecipeDraft:
      type: object
      required: [id, version, state, source, manifest, candidates, selected_assets, diagnostics, created_at, updated_at]
      properties:
        id: {type: string}
        version: {type: integer}
        state: {type: string, enum: [analyzing, needs_input, valid, packaged, installed, failed]}
        source: {type: object}
        resolved_commit: {type: string}
        resolved_tree: {type: string}
        manifest: {type: object}
        candidates: {type: array, items: {type: object}}
        selected_assets: {type: array, items: {type: string}}
        diagnostics: {type: array, items: {type: object}}
        package_digest: {type: string}
        run_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ArtifactKind:
      type: string
      enum: [model, dataset, adapter, checkpoint, recipe, image, result, file]

    Artifact:
      type: object
      required: [id, kind, identity, validation_state]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        identity:
          type: string
          description: Canonical identity, e.g. hf://owner/repo@revision, sha256 digest, or OCI digest
        revision:
          type: string
          nullable: true
        digest:
          type: string
          nullable: true
        validation_state:
          type: string
          enum: [pending, valid, invalid]
        metadata:
          type: object
          additionalProperties: true
        placements:
          type: array
          items:
            $ref: '#/components/schemas/Placement'

    Placement:
      type: object
      required: [artifact_id, node_id, path, state]
      properties:
        artifact_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        path:
          type: string
        state:
          type: string
          enum: [pending, valid, invalid]
        verified_at:
          type: string
          format: date-time
          nullable: true
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'

    TransferRequest:
      type: object
      required: [artifact_id, source_node, dest_node, dest_path]
      properties:
        artifact_id:
          type: string
          format: uuid
        source_node:
          type: string
          format: uuid
        dest_node:
          type: string
          format: uuid
        dest_path:
          type: string

    Transfer:
      type: object
      required: [id, artifact_id, source_node, dest_node, state]
      properties:
        id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        source_node:
          type: string
          format: uuid
        dest_node:
          type: string
          format: uuid
        dest_path:
          type: string
        state:
          type: string
          enum: [pending, transferring, validating, complete, failed, cancelled]
        bytes_total:
          type: integer
          format: int64
        bytes_done:
          type: integer
          format: int64
        diagnostic:
          $ref: '#/components/schemas/Diagnostic'
        created_at:
          type: string
          format: date-time

    RecipeRepositoryVersion:
      type: object
      required: [recipe, commit_sha, canonical, installed_at]
      properties:
        recipe:
          $ref: '#/components/schemas/Recipe'
        commit_sha:
          type: string
        tree_sha:
          type: string
        canonical:
          type: boolean
        installed_at:
          type: string
          format: date-time

    RecipeRepository:
      type: object
      required:
        [id, source_url, source_path, tracking_ref, update_available,
         update_supported, versions, created_at, updated_at]
      properties:
        id:
          type: string
        source_url:
          type: string
        source_path:
          type: string
        tracking_ref:
          type: string
        current_recipe:
          $ref: '#/components/schemas/Recipe'
        installed_commit:
          type: string
        observed_head_commit:
          type: string
        observed_head_tree:
          type: string
        head_checked_at:
          type: string
          format: date-time
        update_available:
          type: boolean
        update_supported:
          type: boolean
        update_diagnostic:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/RecipeRepositoryVersion'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AffectedHardware:
      type: object
      required: [node_id, node_name, node_status, deployment_ids, state]
      properties:
        node_id:
          type: string
        node_name:
          type: string
        node_status:
          type: string
        deployment_ids:
          type: array
          items:
            type: string
        state:
          type: string

    RecipeRepositoryDetail:
      allOf:
        - $ref: '#/components/schemas/RecipeRepository'
        - type: object
          required: [affected_hardware]
          properties:
            affected_hardware:
              type: array
              items:
                $ref: '#/components/schemas/AffectedHardware'

    RecipeRepositoryUpdatePlanRequest:
      type: object
      required: [expected_head_commit]
      properties:
        expected_head_commit:
          type: string

    RecipeRepositoryUpdateRequest:
      type: object
      required: [expected_head_commit, plan_digest]
      properties:
        expected_head_commit:
          type: string
        plan_digest:
          type: string

    RecipeUpdateTarget:
      type: object
      required:
        [source_deployment_id, node_id, node_name, node_status, rank,
         status, phase, current_step, total_steps]
      properties:
        source_deployment_id:
          type: string
        replacement_deployment_id:
          type: string
        node_id:
          type: string
        node_name:
          type: string
        node_status:
          type: string
        rank:
          type: integer
          format: int32
        status:
          type: string
          enum: [pending, running, waiting, succeeded, failed]
        phase:
          type: string
          enum:
            [fetching, validating, installing_recipe, stopping_old,
             waiting_offline, preparing, pulling, starting, verifying, ready,
             rolling_back, restoring_old, restored, skipped, rollback_failed]
        current_step:
          type: integer
        total_steps:
          type: integer
        error_code:
          type: string
        error_message:
          type: string

    RecipeUpdatePlan:
      type: object
      required: [plan_digest, ready, targets, diagnostics]
      properties:
        plan_digest:
          type: string
        ready:
          type: boolean
        targets:
          type: array
          items:
            $ref: '#/components/schemas/RecipeUpdateTarget'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'

    RecipeUpdateAccepted:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string
          format: uuid

    RecipeSource:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [catalog, oci, git, local]
        reference:
          type: string
        revision:
          type: string
        path:
          type: string
        remote:
          type: string
        tree:
          type: string

    RecipeImport:
      type: object
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/RecipeSource'

    Recipe:
      type: object
      required: [digest, name, version, trust_state, installed_at]
      properties:
        digest:
          type: string
        name:
          type: string
        version:
          type: string
        display_name:
          type: string
        model:
          type: string
        engine:
          type: string
        description:
          type: string
        license:
          type: string
        source:
          $ref: '#/components/schemas/RecipeSource'
        trust_state:
          type: string
          enum: [verified, local, untrusted]
        permissions:
          type: array
          items:
            type: string
        compatibility:
          $ref: '#/components/schemas/Compatibility'
        artifact_count:
          type: integer
        profile_count:
          type: integer
        variant_count:
          type: integer
        high_risk:
          type: array
          items:
            type: string
        installed_at:
          type: string
          format: date-time
        version_count:
          type: integer
          description: Other installed versions of the same recipe name
        update:
          $ref: '#/components/schemas/RecipeUpdateStatus'

    RecipeDetail:
      allOf:
        - $ref: '#/components/schemas/Recipe'
        - type: object
          properties:
            manifest:
              type: object
              description: Canonical recipe manifest JSON (localmodelworks/v1alpha1)

    RecipeUpdateStatus:
      type: object
      required: [state, remote, tracking_ref, installed_revision, checked_at]
      properties:
        state:
          type: string
          enum: [current, available, error]
        remote:
          type: string
        tracking_ref:
          type: string
        path:
          type: string
        installed_revision:
          type: string
        candidate_revision:
          type: string
        checked_at:
          type: string
          format: date-time
        error:
          type: string

    Compatibility:
      type: object
      properties:
        nodeCount:
          type: integer
        accelerator:
          type: object
          additionalProperties: true
        fabric:
          type: object
          additionalProperties: true

    RecipeTrustRequest:
      type: object
      required: [trust_state, permission_diff_accepted]
      properties:
        trust_state:
          type: string
          enum: [local, untrusted]
        permission_diff_accepted:
          type: boolean
