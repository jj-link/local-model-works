apiVersion: localmodelworks/v1alpha1
kind: Module
id: coding-traces
title: Coding Traces
route: /coding-traces
nav:
  label: Coding Traces
  order: 60
  icon: coding-traces
settingsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    capture_reasoning:
      type: boolean
      default: true
    retention_days:
      type: integer
      minimum: 0
      maximum: 3650
      default: 0
    export_max_context_tokens:
      type: integer
      minimum: 1024
      maximum: 1048576
      default: 32768
    export_success_cap_per_task:
      type: integer
      minimum: 1
      maximum: 100
      default: 2
jobKinds:
  - trace-tokenize
  - trace-export
  - trace-retention
  - swe-gym-orchestrate
  - swe-gym-rollout
  - swe-gym-grade
artifactKinds:
  - coding-trace-dataset
  - swe-gym-report
apiFragment: api.yaml
capabilities:
  - runs.create
  - runs.read
  - nodes.read
  - deployments.read
  - artifacts.publish
  - settings.read
  - settings.write
  - secrets.read
  - events.publish
