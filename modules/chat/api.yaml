openapi: 3.1.0
info:
  title: Local Model Works chat fragment
  version: 1.0.0
tags:
  - name: chat
paths:
  /chat/completions:
    post:
      tags: [chat]
      operationId: chatCompletions
      summary: Generate one non-streaming chat completion from a running deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Chat completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          description: The deployment endpoint could not complete the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The deployment endpoint timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 65536
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [deployment_id, messages]
      properties:
        deployment_id:
          type: string
          format: uuid
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
          minimum: 1
          maximum: 32768
    ChatAssistantMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          const: assistant
        content:
          type: string
        reasoning_content:
          type: string
    ChatUsage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    ChatCompletionResponse:
      type: object
      additionalProperties: false
      required: [id, model, message]
      properties:
        id:
          type: string
        model:
          type: string
        message:
          $ref: '#/components/schemas/ChatAssistantMessage'
        finish_reason:
          type: string
        usage:
          $ref: '#/components/schemas/ChatUsage'
